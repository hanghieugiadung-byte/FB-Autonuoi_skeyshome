name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"] # Nếu nhánh mặc định của bạn tên là master, hãy đổi chữ main thành master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # CHÚ Ý: Nếu code tạo bằng Vite, giữ nguyên ./dist. Nếu dùng Create React App, đổi thành ./build
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
